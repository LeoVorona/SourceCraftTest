<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="hiTitle hiDesc">
  <title id="hiTitle">Промышленное предприятие с контуром ИИ-аналитики</title>
  <desc id="hiDesc">Схематичное изображение цехов, труб и резервуаров, поверх которого показаны нейросетевые связи, панель метрик и график прогноза отказа.</desc>
  <defs>
    <linearGradient id="hiBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hiGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".97"/>
      <stop offset="1" stop-color="#eef6ff" stop-opacity=".93"/>
    </linearGradient>
    <linearGradient id="hiFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity=".95"/>
      <stop offset="1" stop-color="#eff6ff" stop-opacity=".7"/>
    </linearGradient>
    <pattern id="hiGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2563eb" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="hiGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

