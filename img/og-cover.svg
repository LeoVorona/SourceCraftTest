  <text x="90" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">ИИ, который окупается</text>
  <text x="90" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#ogAccent)">на вашем производстве</text>
  <text x="90" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#cbd5e1">Предиктивная диагностика · Компьютерное зрение · Цифровой двойник</text>
  <text x="90" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#94a3b8">тут могла бы быть ваша реклама</text>
